[package]
name = "downloader"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
sha2 = "0.10"
