[workspace]
members = ["adblock", "url_utils", "site_identity"]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Android arm64 JNI comparisons (z/2/3, both execution orders) favor this hot crate.
# Keep dependencies and URL/bookmark utilities optimized for size.
[profile.release.package.adblock]
opt-level = 3
