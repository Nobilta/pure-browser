<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pure Video Lab</title>
<style>body{font:16px system-ui;margin:16px;background:#111820;color:#e4edf8}video{width:100%;max-height:60vh;background:#000}button,a{display:inline-block;padding:16px;margin:8px 6px 8px 0;border:0;border-radius:12px;background:#bbd9ff;color:#09233f}pre{white-space:pre-wrap;font-size:13px}h2{font-weight:600}</style></head>
<body><h2>Pure Video Lab</h2><video id="player" controls playsinline preload="auto" loop></video>
<button id="start">Play fullscreen</button><button id="play">Play inline</button><button id="rate">Set 1.5x</button>
<a href="sample.mp4" download="pure-video-test.mp4">Download sample</a><pre id="status">Loading</pre>
<script>
const params=new URLSearchParams(location.search), player=document.getElementById('player'), log=document.getElementById('status');
const caseId=params.get('case')||'default';
function state(event){return {event,caseId,paused:player.paused,rate:player.playbackRate,defaultRate:player.defaultPlaybackRate,
 currentTime:player.currentTime,duration:Number.isFinite(player.duration)?player.duration:0,controls:player.controls,
 fullscreen:!!document.fullscreenElement,width:player.videoWidth,height:player.videoHeight,source:player.currentSrc,viewport:{width:innerWidth,height:innerHeight,dpr:devicePixelRatio},startRect:document.getElementById('start').getBoundingClientRect().toJSON(),
 probe:window.__pureBrowserVideoV2?window.__pureBrowserVideoV2.snapshot():null};}
function report(event){const value=state(event);if(event!=='tick')log.textContent=(player.paused?'Paused':'Playing')+' · '+player.playbackRate+'x';fetch('/__state?case='+encodeURIComponent(caseId),{method:'POST',body:JSON.stringify(value),headers:{'Content-Type':'application/json'}}).catch(()=>{});}
['play','pause','ratechange','seeked','loadedmetadata','ended','error'].forEach(name=>player.addEventListener(name,()=>report(name)));
document.addEventListener('fullscreenchange',()=>report('fullscreenchange'));
document.getElementById('start').onclick=()=>{player.play();player.requestFullscreen().catch(()=>report('fullscreen-failed'));};
document.getElementById('play').onclick=()=>player.play();document.getElementById('rate').onclick=()=>{player.playbackRate=1.5;};
const mediaSource=params.has('square')?'sample-default.mp4':'player-sample.mp4';
if(params.has('blob'))fetch(mediaSource).then(r=>r.blob()).then(b=>{player.src=URL.createObjectURL(b);});else player.src=mediaSource;
setInterval(()=>report('tick'),300);
</script></body></html>
