<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="unsafe-url">
<title>Cast referrer fixture</title>
<h1>Cast referrer fixture</h1>
<button onclick="refreshSources()">Refresh sources</button>
<button onclick="document.querySelector('video').play()">Play primary</button>
<video controls muted loop playsinline style="width:100%"></video>
<script>
  const query = '?case=' + encodeURIComponent(new URLSearchParams(location.search).get('case'));
  document.cookie = 'cast_session=' + new URLSearchParams(location.search).get('case') + '; Path=/cast-referer/; SameSite=Lax';
  const mode = new URLSearchParams(location.search).get('case').replace(/-\d+$/, '');
  const primary = ['origin', 'none', 'cdn', 'large', 'boundary', 'over-limit'].includes(mode) ? mode : 'direct';
  if (mode === 'origin' || mode === 'none') document.querySelector('meta[name=referrer]').content = mode === 'none' ? 'no-referrer' : 'origin';
  const direct = '/cast-referer/' + primary + '.mp4' + query;
  document.querySelector('video').src = direct;
  function refreshSources() {
    if (!['large', 'boundary', 'over-limit'].includes(primary)) fetch(direct, {cache: 'no-store'}).catch(() => {});
    if (mode === 'direct' || mode === 'redirect') fetch('/cast-referer/redirect.mp4' + query, {cache: 'no-store'}).catch(() => {});
  }
  if (mode === 'cdn') {
    const seed = document.createElement('iframe'); seed.src = 'http://localhost:8876/cast-referer/seed' + query;
    seed.onload = refreshSources; document.body.appendChild(seed);
  } else refreshSources();
</script>
