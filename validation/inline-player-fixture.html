<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inline player lab</title>
<style>body{margin:0;font:16px system-ui;background:#eee;color:#111}h1{font-size:20px;margin:8px}.player{position:relative;width:100%;background:#111}.media,video{display:block;width:100%}video{aspect-ratio:16/9}.site-controls{position:absolute;bottom:0;left:0;right:0;background:#630;padding:10px;display:flex;justify-content:center}button{padding:10px;min-height:40px;margin:2px}.actions{display:flex;flex-wrap:wrap}#cover{position:fixed;inset:0;background:white;z-index:2147483647;display:none}#after{height:900px}#player.resize{width:85%}</style>
<script>if(new URLSearchParams(location.search).get('variant')==='csp'){const m=document.createElement('meta');m.httpEquiv='Content-Security-Policy';m.content="style-src 'self'; script-src 'self' 'unsafe-inline'; media-src 'self' blob:";document.head.appendChild(m)}</script>
</head><body><h1>Inline player lab</h1>
<div class="player" id="player"><div class="media"><video id="video" controls playsinline preload="auto"></video></div><div class="site-controls" id="site-controls"><button id="site-play">Website play / pause</button></div></div>
<div class="actions"><button id="dynamic">Add website controls</button><button id="resize">Resize video</button><button id="stylesheet">Remove control stylesheet</button><button id="replace">Replace video</button><button id="cover-open">Show page dialog</button></div>
<div id="after">Page content stays visible and scrollable.</div><div id="cover"><button id="cover-close">Close page dialog</button></div>
<script>
const query=new URLSearchParams(location.search),variant=query.get('variant')||'standard',key=query.get('case')||'inline-dev';
let video=document.getElementById('video'),original=video,initialSource='',siteClicks=0,replacements=0;
const player=document.getElementById('player'),site=document.getElementById('site-controls');
if(variant==='standard')site.remove();else video.controls=false;
if(variant==='small')player.style.width='160px';
function box(element){if(!element)return null;const r=element.getBoundingClientRect();return {x:r.left,y:r.top,width:r.width,height:r.height}}
async function source(){video.src=variant==='blob'?URL.createObjectURL(await(await fetch('player-sample.mp4')).blob()):'player-sample.mp4';initialSource=video.src}
source();
document.getElementById('site-play')?.addEventListener('click',()=>{siteClicks++;video.paused?video.play():video.pause()});
document.getElementById('dynamic').onclick=()=>{const c=document.createElement('div');c.className='site-controls';c.textContent='Late site controls';player.appendChild(c)};
document.getElementById('resize').onclick=()=>player.classList.toggle('resize');
document.getElementById('stylesheet').onclick=()=>{const s=Array.from(document.querySelectorAll('style')).find(s=>s.textContent.includes('data-pure-inline-video'));if(s)s.remove()};
document.getElementById('replace').onclick=()=>{const next=document.createElement('video');next.playsInline=true;next.preload='auto';video.pause();video.replaceWith(next);video=next;replacements++;video.controls=variant==='standard';source()};
document.getElementById('cover-open').onclick=()=>document.getElementById('cover').style.display='block';
document.getElementById('cover-close').onclick=()=>document.getElementById('cover').style.display='none';
function snapshot(){const hosts=Array.from(document.querySelectorAll('[data-pure-inline-player]')),host=hosts[0],buttons={};
if(host)host.shadowRoot?.querySelectorAll('[data-action]').forEach(e=>buttons[e.dataset.action]=box(e));
document.querySelectorAll('.actions button,#site-play,#cover-close').forEach(e=>buttons[e.id]=box(e));
return {kind:'player',capturedAt:Date.now(),variant,ready:video.readyState,paused:video.paused,position:video.currentTime,rate:video.playbackRate,muted:video.muted,
duration:video.duration||0,sourceUnchanged:video.src===initialSource,nodeUnchanged:video===original,replacements,siteClicks,
controls:video.controls,hosts:hosts.length,buttons,videoRect:box(video),hostRect:box(host),fullscreen:!!document.fullscreenElement,
siteVisible:Array.from(player.querySelectorAll('.site-controls')).some(e=>{const s=getComputedStyle(e);return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)>0}),
markers:document.querySelectorAll('[data-pure-inline-stage],[data-pure-inline-video]').length,scrollY,viewport:{width:innerWidth,height:innerHeight,dpr:devicePixelRatio}}}
setInterval(()=>fetch('/__state?case='+encodeURIComponent(key),{method:'POST',body:JSON.stringify(snapshot())}).catch(()=>{}),250);
</script></body></html>
