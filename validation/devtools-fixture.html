<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevTools Fixture</title>
<style>
  body { font: 17px/1.5 sans-serif; margin: 0; padding: 20px; }
  h1 { font-size: 24px; }
  .card { border: 1px solid #ddd; border-radius: 10px; padding: 12px; margin: 8px 0; }
</style>
<h1 id="heading">DevTools Fixture</h1>
<nav>
  <a id="second-page" href="?page=second">Second page</a>
  <button id="spa-route">SPA route</button>
</nav>
<div class="card" id="alpha" data-kind="alpha">
  <p>Alpha <strong id="nested">nested</strong> text</p>
  <!-- a comment that must appear in the DOM tree -->
  <ul id="items"><li>one</li><li>two</li><li>three</li></ul>
</div>
<div class="card" id="beta" data-kind="beta">Beta text node</div>
<div id="MixedCase" class="CamelClass">Mixed case element</div>
<div id="shadow-host"></div>
<div id="deep-root" style="display:none"></div>
<iframe id="cross-frame" src="http://127.0.0.1:8876/api/frame" width="200" height="80"></iframe>
<p id="status">running</p>
<pre id="case-results"></pre>
<script>
  (function () {
    if (new URL(location.href).searchParams.get('long')) {
      var main = document.createElement('main');
      for (var i = 0; i < 1500; i++) {
        var p = document.createElement('p');
        p.textContent = 'Long source line ' + i + ' — the text source must page through every line.';
        main.appendChild(p);
      }
      document.body.appendChild(main);
    }
    var deepParent = document.getElementById('deep-root');
    for (var deepIndex = 0; deepIndex < 70; deepIndex++) {
      var deepNode = document.createElement('div');
      deepNode.id = 'depth-' + deepIndex;
      deepParent.appendChild(deepNode);
      deepParent = deepNode;
    }
    var host = document.getElementById('shadow-host');
    var closed = host.attachShadow({ mode: 'closed' });
    closed.innerHTML = '<b>closed shadow content</b>';
    // Storage is seeded here; reads happen from the panel, not by this page.
    try {
      localStorage.setItem('plain', 'local value');
      for (var storageIndex = 1; storageIndex <= 603; storageIndex++) {
        localStorage.setItem('item' + storageIndex, 'value-' + storageIndex);
      }
      localStorage.setItem('json', JSON.stringify({a: 1, nested: {b: [1, 2, 3]}, text: 'hello'}));
      localStorage.setItem('long', 'L'.repeat(100000));
      sessionStorage.setItem('session-plain', 'session value');
      sessionStorage.setItem('session-json', JSON.stringify({tab: 'one'}));
    } catch (e) {}
    function mark(text) { document.getElementById('status').textContent = text; }
    function caseResult(text) {
      var node = document.getElementById('case-results');
      node.textContent += text + '\n';
    }
    var getterOnce = true;
    fetch('/api/echo?case=getter-method', {
      get method() { var value = getterOnce ? 'POST' : 'GET'; getterOnce = false; return value; },
      headers: {'Content-Type': 'application/json'},
      body: '{"getter":true}'
    }).then(function (r) { return r.json(); }).then(function (v) {
      caseResult('getter-method:' + v.method);
    }).catch(function (e) { caseResult('getter-method:error'); });
    var headerIteratorDone = false;
    var onceHeaders = {};
    onceHeaders[Symbol.iterator] = function () {
      return { next: function () {
        if (headerIteratorDone) return { done: true };
        headerIteratorDone = true;
        return { done: false, value: ['X-Once', 'yes'] };
      } };
    };
    fetch('/api/echo?case=headers-iter', {headers: onceHeaders})
      .then(function (r) { return r.json(); })
      .then(function (v) { caseResult('headers-iter:' + ((v.headers && v.headers['x-once']) || 'missing')); })
      .catch(function () { caseResult('headers-iter:error'); });
    fetch(new URL('/api/echo?case=url-object&a=1&a=2', location.href))
      .then(function (r) { return r.json(); })
      .then(function (v) { caseResult('url-object:' + v.query); })
      .catch(function () { caseResult('url-object:error'); });

    var reused = new XMLHttpRequest();
    reused.open('GET', '/api/echo?case=reuse-1');
    reused.onload = function () {
      var first = reused.status;
      reused.open('GET', '/api/echo?case=reuse-2');
      reused.onload = function () { caseResult('reuse:' + first + ',' + reused.status); };
      reused.send();
    };
    reused.send();

    var getterBodyOnce = true;
    fetch('/api/echo?case=getter-body', {
      method: 'POST',
      get body() { var value = getterBodyOnce ? '{"getterBody":1}' : '{}'; getterBodyOnce = false; return value; }
    }).then(function (r) { return r.json(); }).then(function (v) {
      caseResult('getter-body:' + v.method + ':' + v.body);
    }).catch(function () { caseResult('getter-body:error'); });
    fetch('/api/collision').then(function (r) { return r.json(); }).then(function (v) {
      caseResult('collision:' + v['a/b']);
    });

    var postXhr = new XMLHttpRequest();
    postXhr.open('POST', '/api/echo?case=xhr-post');
    postXhr.setRequestHeader('Content-Type', 'application/json');
    postXhr.onload = function () {
      try {
        var reply = JSON.parse(postXhr.responseText);
        caseResult('xhr-post:' + reply.method + ':' + reply.body);
      } catch (e) { caseResult('xhr-post:parse:' + postXhr.status); }
    };
    postXhr.onerror = function () { caseResult('xhr-post:error:' + postXhr.status); };
    postXhr.send('{"xhrPost":true}');
    fetch('/api/cjk').then(function (r) { return r.text(); })
      .then(function (v) { caseResult('cjk:' + v.length); })
      .catch(function () { caseResult('cjk:error'); });
    fetch('/api/echo?x=1&x=2&empty=&sp=a%20b', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Test': 'fixture'},
      body: JSON.stringify({hello: 'world', n: 42})
    }).then(function (r) { return r.json(); }).then(function (v) { mark('fetch-json-ok'); }).catch(function () { mark('fetch-failed'); });
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/api/echo?via=xhr&x=1&x=2');
    xhr.setRequestHeader('X-Xhr', 'yes');
    xhr.onload = function () { mark('xhr-ok'); };
    xhr.send();
    fetch('/api/html').then(function (r) { return r.text(); }).catch(function () {});
    fetch('/api/big').then(function (r) { return r.text(); }).catch(function () {});
    fetch('/api/stream').catch(function () {});
    fetch('http://127.0.0.1:8876/api/cross', {mode: 'no-cors'}).catch(function () {});
    setTimeout(function () { fetch('/api/echo?delayed=1').catch(function () {}); }, 3000);
  })();
</script>
