<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Media lifecycle lab</title>
<style>body{font:16px system-ui;margin:12px}video{width:100%;max-height:180px;background:#111}button{padding:12px;margin:4px}iframe{width:100%;height:450px;border:1px solid #aaa}[hidden]{display:none!important}</style>
</head><body><h3>Media lifecycle lab</h3><main id="lab"></main>
<script>
const params=new URLSearchParams(location.search),key=params.get('case')||'lifecycle',lab=document.getElementById('lab');
let video=null,frame=null,lastAction='loaded';
function button(label,action){const node=document.createElement('button');node.textContent=label;node.onclick=()=>{lastAction=label;action();report();};lab.appendChild(node);}
if(params.has('frame')){
  button('Remove frame',()=>frame.remove());
  frame=document.createElement('iframe');frame.src='http://'+location.hostname+':8876/media-lifecycle-fixture.html?child=1&case='+encodeURIComponent(key+'-child');lab.appendChild(frame);
}else{
  function fresh(){const node=document.createElement('video');node.controls=true;node.playsInline=true;node.preload='auto';node.src='player-sample.mp4?lifecycle='+encodeURIComponent(key);return node;}
  video=fresh();lab.appendChild(video);
  button('Play media',()=>video.play());
  button('Pause media',()=>video.pause());
  button('Finish media',()=>{video.loop=false;video.currentTime=video.duration-.15;video.play();});
  button('Hide media',()=>{video.pause();video.hidden=true;});
  button('Unload media',()=>{video.pause();video.removeAttribute('src');video.load();});
  button('Remove media',()=>{video.pause();video.remove();});
  button('Replace media',()=>{video.pause();const next=fresh();video.replaceWith(next);video=next;});
}
function report(){const state={lastAction,frameConnected:frame?frame.isConnected:false,connected:video?video.isConnected:false,
  paused:video?video.paused:true,ended:video?video.ended:false,ready:video?video.readyState:0,position:video?video.currentTime:0,
  hidden:video?video.hidden:false,source:video?video.currentSrc:null,at:Date.now()};
  fetch('/__state?case='+encodeURIComponent(key),{method:'POST',body:JSON.stringify(state),headers:{'Content-Type':'application/json'}}).catch(()=>{});}
setInterval(report,300);report();
</script></body></html>
