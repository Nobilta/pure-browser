name: CI

# Runs the same entry points contributors run locally, on every push to the default branch and
# every pull request, on all three supported host platforms. Signing and emulator regressions stay
# out of CI by design: signing keys never enter CI (see RELEASING.md), and emulator stages run
# locally with recorded results (see TESTING_GUIDE.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so CI runs the toolchain the release process documents. Actions are pinned to
  # commit SHAs and updated by Dependabot (.github/dependabot.yml).
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'
  RUST_VERSION: '1.98.0'
  NDK_VERSION: '27.2.12479018'
  ANDROID_PLATFORM: 'platforms;android-37.0'
  BUILD_TOOLS: 'build-tools;37.0.0'
  # The harness reads and writes UTF-8 artifacts; Windows would otherwise pick a legacy code page.
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  quick:
    name: Checks, tests and builds (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # All three development hosts run the same quick entry point, so a "supported platform"
        # claim is backed by a job instead of by a convention.
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Pin the interpreter as well: the harness resolves python3 or python, and the localization
      # and release scripts must not depend on whatever the runner image happens to ship.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # rustfmt and clippy are part of the project's checks; both Android targets are needed so the
      # release ABI and the emulator ABI can be cross-compiled on any host.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
          targets: aarch64-linux-android, x86_64-linux-android

      # The action's default package list still asks for "tools", which no longer exists in the
      # SDK repository and makes the step fail; the packages this project needs are installed in
      # the next step.
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      # The NDK is what rust/build.sh links against for the Android targets; the package ids are
      # the ones the verified local build uses. shell: bash keeps one command for all three hosts,
      # which means finding sdkmanager ourselves: Git Bash resolves neither the cmdline-tools
      # layout nor the .bat suffix that Windows uses.
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager.bat || command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager.bat 2>/dev/null | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_SDK_ROOT" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "$ANDROID_PLATFORM" "$BUILD_TOOLS" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties', '**/gradle.lockfile', '**/verification-metadata.xml') }}

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}

      # Localization, Node, Rust and Robolectric checks, including the host JNI libraries.
      - name: Quick checks
        shell: bash
        run: ./build-and-test.sh --quick

      # The release ABI: JNI cross-compile, resource processing with the host aapt2, DEX and
      # packaging. This is what a contributor on this platform would ship.
      - name: Debug build (arm64-v8a)
        shell: bash
        run: ./gradlew :app:assembleDebug --console=plain

      # The emulator ABI: an x86_64 host runs the API 37 emulator natively, and the harness needs a
      # com.mybrowser package for that ABI (see TESTING_GUIDE.md).
      - name: Emulator test package (x86_64)
        shell: bash
        run: ./gradlew -Pmybrowser.abi=x86_64 :app:assembleDebug --console=plain

      # lintDebug needs no signing config: the release signing config is only created when
      # keystore.properties exists, and this variant never touches it.
      - name: Android lint
        if: runner.os == 'Linux'
        shell: bash
        run: ./gradlew :app:lintDebug --console=plain

      # R8, resource shrinking and native packaging only exist in the release variant. Without
      # keystore.properties Gradle produces app-release-unsigned.apk, which is exactly what CI
      # can verify: everything except the signature.
      - name: Unsigned release build
        if: runner.os == 'Linux'
        shell: bash
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Verify the release artifact
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          # Gradle only names the file "unsigned" when no signing config was applied, which is
          # what CI expects; signatures themselves live in the APK Signing Block (v2), so their
          # absence is not observable from the zip entries.
          apk = pathlib.Path('app/build/outputs/apk/release/app-release-unsigned.apk')
          assert apk.is_file(), 'the unsigned release APK is missing'
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
          required = {'lib/arm64-v8a/libmybrowser_adblock.so', 'lib/arm64-v8a/libmybrowser_url_utils.so'}
          missing = required - names
          assert not missing, f'missing JNI libraries: {sorted(missing)}'
          assert 'classes.dex' in names, 'R8 output is missing'
          libs = sorted(n for n in names if n.startswith('lib/') and n.endswith('.so'))
          print(f'OK: {apk.stat().st_size} bytes, R8 output present, libraries: {libs}')
          PY

      # clippy is the static analysis that does not overlap with Android lint, and Rust code is
      # the same on every host, so one run is enough.
      - name: Rust clippy
        if: runner.os == 'Linux'
        shell: bash
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings

      # Reports are worth keeping even when an earlier step failed.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ runner.os }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/apk/**/*.apk
