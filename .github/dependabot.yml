version: 2
updates:
  # Actions are pinned by tag and are the cheapest thing to keep current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Rust dependencies are covered by rust/Cargo.lock, which the build uses with --locked, so a
  # Dependabot PR here is directly usable.
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]

  # Gradle is deliberately absent: app/gradle.lockfile and gradle/verification-metadata.xml are
  # regenerated by hand (see README, "从源码构建"), so an automated version bump would open PRs
  # that cannot pass CI. Update those with the documented local flow instead.
