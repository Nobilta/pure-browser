name: 功能请求
description: 分享你希望增加的功能或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        可以先查看[现有功能与项目范围](https://github.com/Nobilta/pure-browser/blob/main/FEATURES.md)。
        请描述你想解决的问题，以及这个功能会如何帮助你。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述使用场景和当前的不便，而不是直接给实现方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 如果能想到实现思路也可以写，但不是必须
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 例如其他浏览器怎么做的、你目前如何绕过
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 只影响我自己
        - 少数特定网站或场景
        - 通用行为
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我知道这个项目只在能自证验证结果的前提下合入功能，新增能力需要可验证的实现
          required: false
