name: 功能建议
description: 分享你希望增加的功能或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        可以先查看[现有功能](https://github.com/Nobilta/pure-browser/blob/main/FEATURES.md)。
        请描述使用场景，以及这项改进会如何帮助你；不需要提供代码或完整方案。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 在什么场景下，当前的使用方式有什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 描述你希望怎样操作、得到什么结果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 参考或替代方法
      description: 可填写其他应用的做法，或你目前使用的替代方法
    validations:
      required: false
