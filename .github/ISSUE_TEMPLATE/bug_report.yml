name: 缺陷报告
description: 告诉我们遇到了什么问题，以及如何重现
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。可以先查看[现有功能和限制](https://github.com/Nobilta/pure-browser/blob/main/FEATURES.md)，
        以及是否已有相同 Issue。不确定是否属于缺陷时，也欢迎说明实际遇到的问题。
        安全漏洞请通过[私密报告](https://github.com/Nobilta/pure-browser/security/advisories/new)提交。
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 可在“设置 → 关于”查看；自行构建时请注明提交或分支
      placeholder: 例如 0.9.1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统
      description: 填写机型或模拟器、Android 版本；如知道，也请填写 WebView 版本
      placeholder: 例如 Pixel 7 / Android 15
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 如何重现
      description: 写出操作步骤；涉及特定网页时，可附网址或最小 HTML，注意移除个人信息
      placeholder: |
        1. 打开 …
        2. 点击 …
        3. 观察 …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果与实际结果
      description: 你希望发生什么，实际发生了什么？
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 浏览模式
      options:
        - 普通模式
        - 无痕模式
        - 两者都有
        - 不确定或与浏览模式无关
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 补充信息
      description: 可附截图、录屏或日志；请移除账号、令牌及其他私人信息
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 版本确认
      options:
        - label: 我已在最新正式版上尝试重现
          required: false
