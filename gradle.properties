# Bound heap usage while allowing Kotlin/R8/lint class metadata without repeated unloading.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Do not keep the Gradle daemon resident after builds (saves ~3 GB idle memory).
# Trade-off: each build pays daemon startup + configuration cost (~tens of seconds).
org.gradle.daemon=false

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX only, no support-library shims.
android.useAndroidX=true

# We deliberately do NOT set android.builtInKotlin=false / android.newDsl=false.
# AGP 9 has built-in Kotlin; the org.jetbrains.kotlin.android plugin is not applied.
# Those two escape hatches disappear in AGP 10, so we start on the new path.

# R8 full mode. Default in AGP 8+, stated explicitly so an upgrade can't silently flip it.
android.enableR8.fullMode=true

# Only build the ABI we actually ship. The Rust filter engine is cross-compiled
# for arm64-v8a only, so any other ABI would ship a JNI lib we don't have.
mybrowser.abi=arm64-v8a
